version: '3.8'

services:
  # Konfigurasi container database
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgre_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: harkat_app_library
    ports:
      # Format portDiKomputer:PortDiContainer
      - "5432:5432"
    volumes:
      # Menyimpan database ke hdd
      - postgre_data_volume:/var/lib/postgresql/data

volumes:
  postgre_data_volume: